<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leungo</title>
<style>
  :root {
    --bg: #101014; --panel: #18181d; --line: #26262c; --text: #d8d8dc;
    --dim: #8b8b93; --accent: #34d399; --warn: #f59e0b; --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 16px; gap: 12px; max-width: 1400px;
    margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  .badge { padding: 3px 10px; border-radius: 4px; font-size: 12.5px; background: var(--panel);
    border: 1px solid var(--line); }
  .state-active { color: var(--accent); border-color: var(--accent); }
  .state-analyzing { color: var(--warn); border-color: var(--warn); }
  .state-idle { color: var(--dim); }
  .state-bypassed { color: var(--warn); border-color: var(--warn); }
  .archetype { color: var(--accent); }
  .meta { color: var(--dim); font-size: 12.5px; }
  .now { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .now .t { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 46vw; }
  .now .a { font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 46vw; }
  .spacer { flex: 1; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 6px 8px; border-radius: 4px; font-size: 13px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 7px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { color: var(--warn); border-color: var(--warn); }
  .grid { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; flex: 1; min-height: 46vh; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; display: flex; flex-direction: column; min-height: 280px; }
  .card h2 { font-size: 12px; margin: 2px 0 8px 4px; color: var(--dim); font-weight: 500; }
  canvas { width: 100%; flex: 1; display: block; }
  #msg { color: var(--err); font-size: 12.5px; min-height: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>leungo</h1>
  <span class="badge" id="state">starting</span>
  <span class="badge" id="arch" hidden></span>
  <label class="meta" for="tuning">Tuning</label>
  <select id="tuning" title="How hard and how fast the EQ adapts">
    <option value="conservative">Conservative</option>
    <option value="balanced">Balanced</option>
    <option value="aggressive">Aggressive</option>
    <option value="custom">Custom (config file)</option>
  </select>
  <button id="bypass" hidden>Bypass</button>
  <div class="now" id="now" hidden><span class="t" id="nowTitle"></span><span class="a" id="nowArtist"></span></div>
  <span class="spacer"></span>
  <span class="meta" id="tracks"></span>
</header>
<div class="grid">
  <div class="card">
    <h2>Playing spectrum</h2>
    <canvas id="spectrum"></canvas>
  </div>
  <div class="card">
    <h2>EQ response</h2>
    <canvas id="curve"></canvas>
  </div>
</div>
<div id="msg"></div>

<script>
const clamp = 12.0, q = 1.41, fs = 48000;
const FMIN = 40, FMAX = 16000;
const state = { data: null };

async function poll() {
  try {
    const r = await fetch('/api/state');
    if (r.ok) { state.data = await r.json(); renderHeader(); }
  } catch (e) { msg('daemon unreachable'); }
  setTimeout(poll, 200);
}

function msg(text) { document.getElementById('msg').textContent = text; }

function renderHeader() {
  const d = state.data;
  const stateEl = document.getElementById('state');
  const label = d.state + (d.bypassed ? ' (bypassed)' : '');
  stateEl.textContent = label;
  stateEl.className = 'badge state-' + (d.bypassed ? 'bypassed' : d.state);
  const arch = document.getElementById('arch');
  if (d.archetype) {
    arch.hidden = false;
    arch.className = 'badge archetype';
    arch.textContent = d.archetype + ' \u00b7 measurement ' + Math.round((d.reliability || 0) * 100) + '% repeatable';
    arch.title = 'Style match margin: ' + Math.round((d.confidence || 0) * 100) + '%. The percentage shown is how closely two halves of the measurement agree.';
  } else { arch.hidden = true; }
  document.getElementById('tracks').textContent = 'tracks: ' + d.tracks;
  const np = d.nowPlaying;
  const nowEl = document.getElementById('now');
  if (np && (np.title || np.artist)) {
    nowEl.hidden = false;
    document.getElementById('nowTitle').textContent = np.title || '';
    document.getElementById('nowArtist').textContent =
      [np.artist, np.album].filter(Boolean).join(' \u00b7 ');
  } else { nowEl.hidden = true; }
  const btn = document.getElementById('bypass');
  btn.hidden = false;
  btn.classList.toggle('on', !!d.bypassed);
  btn.textContent = d.bypassed ? 'Adaptive EQ off' : 'Bypass';
  const sel = document.getElementById('tuning');
  if (d.tuning && document.activeElement !== sel && sel.value !== d.tuning) sel.value = d.tuning;
  document.getElementById('msg').textContent = d.message || '';
}

document.getElementById('tuning').onchange = (e) => {
  fetch('/api/tuning/' + encodeURIComponent(e.target.value), { method: 'POST' });
};

document.getElementById('bypass').onclick = () => {
  const on = !(state.data && state.data.bypassed);
  fetch('/api/bypass/' + (on ? 'on' : 'off'), { method: 'POST' });
};

function setup(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

const XL = Math.log10(FMIN), XH = Math.log10(FMAX);
const xf = f => (Math.log10(f) - XL) / (XH - XL);

function fmtHz(f) {
  return f >= 1000 ? (f / 1000).replace(/\.0$/, '') + 'k' : f + '';
}
const TICKS = [50, 100, 200, 500, 1000, 2000, 5000, 10000];
const fmtTick = f => f >= 1000 ? (f / 1000) + 'k' : f;

function frame(ctx, w, h, ticks, vmin, vmax, unit) {
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#26262c';
  ctx.fillStyle = '#8b8b93';
  ctx.font = '11px system-ui';
  ctx.lineWidth = 1;
  for (const f of TICKS) {
    const x = 34 + xf(f) * (w - 40);
    ctx.beginPath(); ctx.moveTo(x, 6); ctx.lineTo(x, h - 22); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillText(fmtTick(f), x, h - 7);
  }
  const step = Math.max(6, Math.ceil((vmax - vmin) / 60) * 6);
  ctx.textAlign = 'right';
  for (let v = Math.ceil(vmin / step) * step; v <= vmax; v += step) {
    const y = ymap(v, vmin, vmax, h);
    ctx.strokeStyle = '#26262c';
    ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(w - 6, y); ctx.stroke();
    ctx.fillText(v + unit, 30, y + 3.5);
  }
}

function ymap(v, vmin, vmax, h) {
  return h - 22 - (v - vmin) / (vmax - vmin) * (h - 34);
}

function drawSpectrum() {
  const cv = document.getElementById('spectrum');
  const { ctx, w, h } = setup(cv);
  const pts = (state.data && state.data.spectrum) || [];
  let vmax = -20, vmin = -110;
  for (const [, db] of pts) { if (db > vmax) vmax = db; if (db < vmin) vmin = db; }
  if (pts.length === 0) { vmax = 0; vmin = -110; }
  vmax = Math.ceil((vmax + 6) / 12) * 12;
  vmin = Math.floor((vmin - 4) / 12) * 12;
  frame(ctx, w, h, TICKS, vmin, vmax, '');
  ctx.strokeStyle = '#34d399';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  let first = true;
  for (const [f, db] of pts) {
    const x = 34 + xf(f) * (w - 40);
    const y = ymap(db, vmin, vmax, h);
    if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
  }
  if (!first) ctx.stroke();
}

// RBJ peaking magnitude, same math as the engine solver
function bandDb(f, f0, gain, q) {
  const A = Math.pow(10, gain / 40);
  const w0 = 2 * Math.PI * f0 / fs, w = 2 * Math.PI * f / fs;
  const alpha = Math.sin(w0) / (2 * q), c = Math.cos(w0);
  const b0 = 1 + alpha * A, b1 = -2 * c, b2 = 1 - alpha * A;
  const a0 = 1 + alpha / A, a1 = -2 * c, a2 = 1 - alpha / A;
  const sw = Math.sin(w), cw = Math.cos(w), s2 = Math.sin(2 * w), c2 = Math.cos(2 * w);
  const n = Math.pow(b0 + b1 * cw + b2 * c2, 2) + Math.pow(-(b1 * sw + b2 * s2), 2);
  const d = Math.pow(a0 + a1 * cw + a2 * c2, 2) + Math.pow(-(a1 * sw + a2 * s2), 2);
  return 10 * Math.log10(n / d);
}

function drawCurve() {
  const cv = document.getElementById('curve');
  const { ctx, w, h } = setup(cv);
  const d = state.data;
  const gains = (d && d.gains) || [];
  const freqs = (d && d.bandFreqs) || [];
  frame(ctx, w, h, TICKS, -clamp, clamp, 'dB');
  // 0 line
  ctx.strokeStyle = '#3c3c44';
  ctx.beginPath();
  ctx.moveTo(34, ymap(0, -clamp, clamp, h));
  ctx.lineTo(w - 6, ymap(0, -clamp, clamp, h));
  ctx.stroke();
  // band markers
  ctx.fillStyle = '#56565e';
  for (let i = 0; i < freqs.length; i++) {
    const x = 34 + xf(freqs[i]) * (w - 40);
    const g = i < gains.length ? gains[i] : 0;
    ctx.beginPath();
    ctx.arc(x, ymap(g, -clamp, clamp, h), 3, 0, 7);
    ctx.fill();
  }
  if (freqs.length === 0) return;
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i <= 240; i++) {
    const f = FMIN * Math.pow(FMAX / FMIN, i / 240);
    let db = 0;
    for (let b = 0; b < freqs.length; b++) {
      const g = b < gains.length ? gains[b] : 0;
      db += bandDb(f, freqs[b], g, q);
    }
    const x = 34 + xf(f) * (w - 40);
    const y = ymap(Math.max(-clamp, Math.min(clamp, db)), -clamp, clamp, h);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function paint() {
  drawSpectrum();
  drawCurve();
  requestAnimationFrame(paint);
}
paint();
poll();
</script>
</body>
</html>
