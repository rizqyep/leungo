[workspace]
resolver = "2"
members = [
    "crates/leungo-dsp",
    "crates/leungo-eq",
    "crates/leungo-analysis",
    "crates/leungo-capture-pipewire",
    "crates/leungo-applier-ee",
    "crates/leungo-players",
    "crates/leungo-standalone",
    "crates/leungo-core",
    "crates/leungo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
leungo-dsp = { path = "crates/leungo-dsp" }
leungo-eq = { path = "crates/leungo-eq" }
leungo-analysis = { path = "crates/leungo-analysis" }
leungo-capture-pipewire = { path = "crates/leungo-capture-pipewire" }
leungo-applier-ee = { path = "crates/leungo-applier-ee" }
leungo-players = { path = "crates/leungo-players" }
leungo-standalone = { path = "crates/leungo-standalone" }
leungo-core = { path = "crates/leungo-core" }
libpulse-binding = "2"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
hound = "3"
ctrlc = "3"

[profile.release]
lto = "thin"
codegen-units = 1
