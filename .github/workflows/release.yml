name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p leungo-cli
      - name: Package
        run: packaging/macos/build-dmg.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Leungo $GITHUB_REF_NAME" \
            --notes "Unsigned macOS build for Apple silicon. See the README for install steps and the first-launch Gatekeeper workaround. Audio has not been verified on all hardware; please report problems."
