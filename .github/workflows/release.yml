name: release

on:
  push:
    tags: ["v*"]
  # Builds and checks the packages without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p leungo-cli
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V=0.0.0-dev; fi
          packaging/macos/build-dmg.sh "$V" dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  linux-packages:
    # Built on the oldest runner image still offered so the binary links
    # against an older glibc and runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - name: Packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - run: cargo build --release -p leungo-cli
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V=0.0.0-dev; fi
          mkdir -p dist
          cargo deb -p leungo-cli --no-build --deb-version "$V" --output "dist/leungo_${V}_amd64.deb"
          # RPM versions cannot contain '-'; '~' is its pre-release separator.
          RV="$(printf '%s' "$V" | tr '-' '~')"
          cargo generate-rpm -p crates/leungo-cli -s "version = \"$RV\"" -s 'release = "1"' -o dist/
          for f in dist/*.deb dist/*.rpm; do (cd dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256"); done
          ls -la dist
      - name: Check the deb installs and runs
        run: |
          sudo apt-get install -y ./dist/*.deb
          dpkg -s leungo | grep -E '^(Package|Version|Depends|Recommends)'
          leungo setup
      - name: Check the rpm installs and runs on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c \
            'dnf install -y --setopt=install_weak_deps=False /dist/*.rpm && rpm -qi leungo | head -3 && leungo setup'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  windows-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p leungo-cli -p leungo-app
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package
        shell: pwsh
        run: |
          $V = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          $name = "leungo-$V-windows-x64"
          New-Item -ItemType Directory -Force "stage/$name", dist | Out-Null
          Copy-Item target/release/leungo.exe, target/release/leungo-app.exe, assets/brand/app/leungo.ico, LICENSE, README.md "stage/$name"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$V" packaging/windows/leungo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -Exclude *.sha256 | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }
          Get-ChildItem dist
      - name: Check the setup installs and runs
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Leungo"
          & "$dir\leungo.exe" --version
          if (-not (Test-Path "$dir\leungo-app.exe")) { throw 'leungo-app.exe missing' }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          if (Test-Path "$dir\leungo.exe") { throw 'uninstall left leungo.exe behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  publish:
    if: github.ref_type == 'tag'
    needs: [macos-dmg, linux-packages, windows-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # this version's section of CHANGELOG.md, without its heading
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\n---\nUnsigned macOS build for Apple silicon (.dmg), Linux x86_64 packages (.deb, .rpm), and an unsigned Windows x64 installer (-setup.exe, which also offers to install Equalizer APO) and .zip. See the README for install steps. Audio has not been verified on all hardware; please report problems.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Leungo $GITHUB_REF_NAME" \
            --notes-file notes.md
